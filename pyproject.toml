[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-pilot"
version = "0.1.0"
description = "Navigate pages, click elements, and take screenshots — a lightweight Playwright wrapper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["browser", "automation", "playwright", "screenshot", "scraping", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.40",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.5",
]

[project.scripts]
browser-pilot = "browser_pilot.cli:main"

[project.urls]
Repository = "https://github.com/mohanish3/browser-pilot"
Issues = "https://github.com/mohanish3/browser-pilot/issues"

[tool.hatch.build.targets.wheel]
packages = ["browser_pilot"]
